---
- name: Install dependencies
  apt:
    name:
      - curl
      - gnupg2
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: true

- name: Add Wazuh repository key
  apt_key:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    state: present

- name: Add Wazuh repository
  apt_repository:
    repo: "deb https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh

- name: Install Wazuh Indexer
  apt:
    name: "wazuh-indexer={{ wazuh_version }}-1"
    state: present
    update_cache: true

- name: Generate certificates for Indexer
  block:
    - name: Create certs directory
      file:
        path: /etc/wazuh-indexer/certs
        state: directory
        mode: '0750'
        owner: wazuh-indexer
        group: wazuh-indexer

    - name: Download cert generation tool
      get_url:
        url: https://packages.wazuh.com/4.x/apt/pool/main/w/wazuh-indexer/wazuh-indexer-certs-tool
        dest: /usr/local/bin/wazuh-indexer-certs-tool
        mode: '0755'

    - name: Generate Indexer certificates
      command: /usr/local/bin/wazuh-indexer-certs-tool -A -n {{ indexer_node_name }} -o /etc/wazuh-indexer/certs
      args:
        creates: /etc/wazuh-indexer/certs/admin.pem
      become: true
      become_user: wazuh-indexer

- name: Configure OpenSearch (indexer)
  template:
    src: opensearch.yml.j2
    dest: /etc/wazuh-indexer/opensearch.yml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0640'
  notify: Restart Wazuh Indexer

- name: Configure JVM options
  template:
    src: jvm.options.j2
    dest: /etc/wazuh-indexer/jvm.options
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0640'
  notify: Restart Wazuh Indexer

- name: Configure internal users
  template:
    src: internal_users.yml.j2
    dest: /etc/wazuh-indexer/internal_users.yml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0640'
  notify: Restart Wazuh Indexer

- name: Enable and start Wazuh Indexer
  systemd:
    name: wazuh-indexer
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for Indexer to be ready
  uri:
    url: "https://{{ indexer_ip }}:9200/_cluster/health"
    user: admin
    password: "{{ indexer_admin_password }}"
    validate_certs: false
    status_code: 200
  register: indexer_health
  until: indexer_health.json.status in ['green', 'yellow']
  retries: 30
  delay: 10

- name: Initialize security plugin
  command: /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh -cd /usr/share/wazuh-indexer/plugins/opensearch-security/securityconfig/ -nhnv -cacert /etc/wazuh-indexer/certs/root-ca.pem -cert /etc/wazuh-indexer/certs/admin.pem -key /etc/wazuh-indexer/certs/admin-key.pem
  args:
    creates: /var/lib/wazuh-indexer/.security_initialized
  become: true
  become_user: wazuh-indexer
  notify: Restart Wazuh Indexer

- name: Mark security as initialized
  file:
    path: /var/lib/wazuh-indexer/.security_initialized
    state: touch
    owner: wazuh-indexer
    group: wazuh-indexer

- name: Create index template for Wazuh
  uri:
    url: "https://{{ indexer_ip }}:9200/_index_template/wazuh-template"
    method: PUT
    user: admin
    password: "{{ indexer_admin_password }}"
    validate_certs: false
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ lookup('file', '../templates/wazuh-index-template.json') }}"
  when: indexer_health.json.status in ['green', 'yellow']

- name: Configure ILM policy
  uri:
    url: "https://{{ indexer_ip }}:9200/_ilm/policy/wazuh-ilm-policy"
    method: PUT
    user: admin
    password: "{{ indexer_admin_password }}"
    validate_certs: false
    headers:
      Content-Type: "application/json"
    body_format: json
    body: "{{ lookup('file', '../templates/ilm-policy.json') }}"
  when: indexer_health.json.status in ['green', 'yellow']

- name: Configure snapshot repository (optional)
  block:
    - name: Create backup directory
      file:
        path: /mnt/backups/wazuh
        state: directory
        mode: '0750'
        owner: wazuh-indexer
        group: wazuh-indexer

    - name: Register snapshot repository
      uri:
        url: "https://{{ indexer_ip }}:9200/_snapshot/wazuh-backup"
        method: PUT
        user: admin
        password: "{{ indexer_admin_password }}"
        validate_certs: false
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          type: fs
          settings:
            location: /mnt/backups/wazuh
            compress: true
  when: backup_enabled | default(false)

- name: Display Indexer info
  debug:
    msg: |
      Wazuh Indexer deployed successfully!
      - URL: https://{{ indexer_ip }}:9200
      - User: admin
      - Password: {{ indexer_admin_password }}
      - Certs: /etc/wazuh-indexer/certs/