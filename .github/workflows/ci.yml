---
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: |
          pip install ansible-lint yamllint
          sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node.js linting tools
        run: |
          npm install -g markdownlint-cli
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Ansible playbooks
        run: |
          cd ansible
          ansible-lint site.yml
          ansible-lint roles/

      - name: Lint YAML files
        run: |
          yamllint -c .yamllint .github/workflows/
          yamllint -c .yamllint ansible/
          yamllint -c .yamllint docs/

      - name: Lint Markdown files
        run: |
          markdownlint "**/*.md" --ignore node_modules

      - name: Lint Shell scripts
        run: |
          find . -name "*.sh" -type f | xargs shellcheck

      - name: Validate XML rules
        run: |
          xmllint --noout rules/local_rules.xml

      - name: Validate dashboard JSON
        run: |
          for file in dashboards/*.ndjson; do
            echo "Validating $file"
            while IFS= read -r line; do
              echo "$line" | jq . > /dev/null
            done < "$file"
          done

  test-ansible-syntax:
    name: Test Ansible Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible-core==2.16.*

      - name: Check Ansible syntax
        run: |
          cd ansible
          ansible-playbook -i inventory.yml site.yml --syntax-check
          ansible-playbook -i inventory.yml site.yml --list-tasks

  validate-documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for broken links (internal only)
        uses: lycheeverse/lychee-action@v1
        with:
          args: |
            --verbose --max-concurrency 10 --exclude-mail --no-progress
            --exclude "https://documentation.wazuh.com/*"
            --exclude "https://opensearch.org/*"
            --exclude "https://attack.mitre.org/*"
            --exclude "https://sigmahq.io/*"
            docs/
          fail: true

      - name: Validate Mermaid diagrams
        run: |
          # Check if mermaid diagrams in ARCHITECTURE.md are valid
          grep -A 50 "mermaid" ARCHITECTURE.md | head -50

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build documentation (no-build approach)
        run: |
          # GitHub Pages serves docs/ folder directly - no build needed
          # Just verify the docs folder exists and has content
          ls -la docs/
          echo "Documentation ready for GitHub Pages (served from docs/ folder)"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test-ansible-syntax, validate-documentation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          git log --oneline --since="$(git log -1 --format=%ai HEAD~10)" --format="* %s" > CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            rules/local_rules.xml
            dashboards/*.ndjson
            attack-scenarios/*.sh
            scripts/*.sh
          generate_release_notes: true